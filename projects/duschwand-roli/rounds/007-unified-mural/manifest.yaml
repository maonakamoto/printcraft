learnings:
  - Unified generation works — no compositing seams
  - Portrait format requires explicit prompt ("tall vertical", "portrait orientation")
  - Text overlays sneak in unless prompt says "no text" explicitly
  - Style reference upload is optional; pure text prompts also work with enough detail
